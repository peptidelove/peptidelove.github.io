<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#eef1f6"/>
      <stop offset="100%" stop-color="#d5dbe6"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#c8d0dd"/>
      <stop offset="38%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#bfc8d7"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#8d9bea"/>
      <stop offset="60%" stop-color="#6558d8"/>
      <stop offset="100%" stop-color="#5142cb"/>
    </linearGradient>

    <!-- extrude: dark down-right, white up-left -->
    <filter id="out" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="10" dy="11" stdDeviation="10" flood-color="#98a7bf" flood-opacity="0.9"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.95"/>
    </filter>
    <!-- softer version for the cap so it sits on the body rather than floating -->
    <filter id="outSm" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="6" dy="7" stdDeviation="6" flood-color="#98a7bf" flood-opacity="0.85"/>
      <feDropShadow dx="-4" dy="-5" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="cut" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="0.6" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>

    <clipPath id="bodyClip"><path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#e0e5ec"/>
  <!-- neck first, so the cap overlaps it and the two read as one object -->
  <g filter="url(#outSm)">
    <rect x="212" y="120" width="88" height="62" rx="10" fill="url(#ground)"/>
  </g>

  <!-- glass body, extruded out of the surface -->
  <g filter="url(#out)">
    <path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z" fill="url(#ground)"/>
  </g>

  <!-- dose: the one colour in the mark -->
  <g clip-path="url(#bodyClip)">
    <rect x="160" y="292" width="200" height="150" fill="url(#liquid)"/>
    <rect x="160" y="292" width="200" height="8" fill="#ffffff" opacity="0.45"/>
    <!-- scale ticks continue over the liquid, lighter -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45">
      <line x1="216" y1="336" x2="248" y2="336"/>
      <line x1="216" y1="382" x2="264" y2="382"/>
    </g>
  </g>

  <!-- engraved scale on the empty glass above the liquid -->
  <g filter="url(#cut)" stroke="#a9b6ca" stroke-width="7" stroke-linecap="round">
    <line x1="216" y1="212" x2="264" y2="212"/>
    <line x1="216" y1="252" x2="248" y2="252"/>
  </g>

  <!-- dose marker at the liquid line, in the app's highlight colour -->
  <rect x="168" y="286" width="30" height="15" rx="6" fill="#FF8A1E"/>
  <rect x="192" y="288" width="152" height="10" rx="5" fill="#FF8A1E"/>

  <!-- cap, seated on the neck -->
  <g filter="url(#outSm)">
    <rect x="180" y="74" width="152" height="62" rx="20" fill="url(#capg)"/>
  </g>
  <ellipse cx="256" cy="86" rx="56" ry="10" fill="#ffffff" opacity="0.55"/>

  <!-- glass highlight -->
  <g clip-path="url(#bodyClip)">
    <rect x="212" y="196" width="14" height="216" rx="7" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
