<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bodyClip">
      <path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#080d18"/>

  <!-- cap and neck -->
  <rect x="180" y="70" width="152" height="62" rx="20" fill="#ffffff"/>
  <rect x="220" y="124" width="72" height="58" fill="#ffffff"/>

  <g clip-path="url(#bodyClip)">
    <!-- reconstituted liquid -->
    <rect x="150" y="300" width="220" height="150" fill="#cfcaff"/>
    <!-- dose marker at the fill line -->
    <rect x="150" y="278" width="220" height="24" fill="#FF8A1E"/>
  </g>

  <!-- graduated scale on the clear glass -->
  <g stroke="#ffffff" stroke-width="15" stroke-linecap="round">
    <line x1="210" y1="212" x2="272" y2="212"/>
    <line x1="210" y1="250" x2="246" y2="250"/>
  </g>

  <!-- glass wall, drawn last so it stays unbroken -->
  <path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z"
        fill="none" stroke="#ffffff" stroke-width="22"/>
</svg>
