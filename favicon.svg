<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#243050"/>
      <stop offset="55%" stop-color="#141c30"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#6f7fe8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6f7fe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f2f5fa"/>
      <stop offset="48%" stop-color="#d3dae8"/>
      <stop offset="100%" stop-color="#aab4c8"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#aeb8cc"/>
      <stop offset="38%" stop-color="#f6f9fd"/>
      <stop offset="100%" stop-color="#9fa9c0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#8f9df2"/>
      <stop offset="55%" stop-color="#6558e0"/>
      <stop offset="100%" stop-color="#5142cb"/>
    </linearGradient>

    <filter id="out" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="8" dy="10" stdDeviation="11" flood-color="#03060e" flood-opacity="0.85"/>
      <feDropShadow dx="-5" dy="-6" stdDeviation="7" flood-color="#7d8bb5" flood-opacity="0.35"/>
    </filter>
    <filter id="outSm" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="5" dy="7" stdDeviation="7" flood-color="#03060e" flood-opacity="0.8"/>
      <feDropShadow dx="-3" dy="-4" stdDeviation="5" flood-color="#7d8bb5" flood-opacity="0.3"/>
    </filter>

    <clipPath id="bodyClip"><path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="210" fill="url(#halo)"/>

  <g filter="url(#outSm)">
    <rect x="212" y="120" width="88" height="62" rx="10" fill="url(#glass)"/>
  </g>

  <g filter="url(#out)">
    <path d="M198 170 h116 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-104 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z" fill="url(#glass)"/>
  </g>

  <g clip-path="url(#bodyClip)">
    <rect x="160" y="292" width="200" height="150" fill="url(#liquid)"/>
    <rect x="160" y="292" width="200" height="8" fill="#ffffff" opacity="0.5"/>
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.5">
      <line x1="216" y1="336" x2="248" y2="336"/>
      <line x1="216" y1="382" x2="264" y2="382"/>
    </g>
  </g>

  <!-- engraved scale on the empty glass -->
  <g stroke="#7f8ba3" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="216" y1="212" x2="264" y2="212"/>
    <line x1="216" y1="252" x2="248" y2="252"/>
  </g>

  <!-- dose marker -->
  <rect x="168" y="286" width="30" height="15" rx="6" fill="#FF8A1E"/>
  <rect x="192" y="288" width="152" height="10" rx="5" fill="#FF8A1E"/>

  <g filter="url(#outSm)">
    <rect x="180" y="74" width="152" height="62" rx="20" fill="url(#capg)"/>
  </g>
  <ellipse cx="256" cy="86" rx="56" ry="10" fill="#ffffff" opacity="0.6"/>

  <g clip-path="url(#bodyClip)">
    <rect x="212" y="196" width="14" height="216" rx="7" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
