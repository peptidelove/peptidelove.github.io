<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#162c46"/>
      <stop offset="58%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="56%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f3fb5"/>
      <stop offset="32%" stop-color="#cdb9f8"/>
      <stop offset="66%" stop-color="#8b6ae0"/>
      <stop offset="100%" stop-color="#523191"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b39cfb"/>
      <stop offset="48%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#8fd6ff" stop-opacity="0.07"/>
      <stop offset="78%" stop-color="#8fd6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0.26"/>
    </linearGradient>
    <clipPath id="bodyClip"><path d="M182 170 h148 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-128 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z"/></clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="284" r="208" fill="url(#halo)"/>

  <!-- glass body -->
  <path d="M182 170 h148 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-128 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z" fill="url(#glass)"/>

  <!-- liquid, clipped so it keeps the rounded base -->
  <g clip-path="url(#bodyClip)">
    <rect x="160" y="258" width="192" height="180" fill="url(#liquid)"/>
    <rect x="160" y="258" width="192" height="11" fill="#d6f9ff" opacity="0.92"/>
    <!-- graduation ticks, over glass and liquid alike -->
    <g stroke="#eaffff" stroke-width="9" stroke-linecap="round" opacity="0.62">
      <line x1="196" y1="214" x2="236" y2="214"/>
      <line x1="196" y1="306" x2="236" y2="306"/>
      <line x1="196" y1="356" x2="236" y2="356"/>
    </g>
    <!-- glass highlight down the left edge -->
    <rect x="192" y="196" width="13" height="216" rx="6.5" fill="#ffffff" opacity="0.20"/>
  </g>

  <!-- outline last, so the stroke stays crisp over the fill -->
  <path d="M182 170 h148 a22 22 0 0 1 22 22 v210 a32 32 0 0 1 -32 32 h-128 a32 32 0 0 1 -32 -32 v-210 a22 22 0 0 1 22 -22 z" fill="none" stroke="#3ee4ff" stroke-width="11" stroke-linejoin="round"/>

  <!-- neck + cap -->
  <rect x="204" y="126" width="104" height="52" fill="#0c1728" stroke="#3ee4ff" stroke-width="10"/>
  <rect x="172" y="72" width="168" height="66" rx="20" fill="url(#cap)"/>
  <ellipse cx="256" cy="81" rx="70" ry="13" fill="#e7dcff" opacity="0.5"/>
</svg>
